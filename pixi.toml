[workspace]
name = "trackeverything"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Isolated environment for TrackEverything standalone inference.
# Fully independent from the production ComfyUI installation
# (/home/egorkkk/ComfyUI) - no shared site-packages, no shared CUDA toolkit.
#
# Python 3.10 matches the version the upstream project is tested on
# (see external/trackeverything/README.md "Installation").

[dependencies]
python = "3.10.*"
pip = "*"

# ---------------------------------------------------------------------------
# CUDA compiler - used ONLY to compile the `torch_scatter` extension from
# source (see scripts/build_torch_scatter.sh).
#
# The upstream README installs `torch_scatter` from the prebuilt PyG wheel
# index (https://data.pyg.org/whl/torch-2.8.0+cu129.html). That host is
# throttled to ~16 KiB per connection from this machine, so the wheel cannot
# be fetched in reasonable time. We therefore compile the exact same upstream
# version (2.1.2) against the same Torch 2.8.0+cu129 build.
#
# nvcc is not used at inference time.
# ---------------------------------------------------------------------------
cuda-nvcc = "12.9.*"
cuda-cudart-dev = "12.9.*"
cuda-cccl = "12.9.*"
cuda-libraries-dev = "12.9.*"

# The upstream project additionally needs the deformable-attention CUDA
# extension (libs/ops) for TRAINING only. Inference does not require it,
# so it is deliberately not built here.

# NOTE: opencv-python needs libGL.so.1, which is already present on the host.
# The upstream project additionally needs the deformable-attention CUDA
# extension (libs/ops) for TRAINING only. Inference does not require it,
# so it is deliberately not built here.

[tasks]
# The upstream repository *is* the `trackeverything` package, so its PARENT
# directory (external/) has to be importable.
env-check-env = { cmd = "echo $PYTHONPATH" }

# --- environment ------------------------------------------------------------
env-info = { cmd = "python -c \"import sys,torch;print(sys.version);print('torch',torch.__version__,'cuda',torch.version.cuda)\"", description = "Print Python/Torch/CUDA versions" }

# --- checks -----------------------------------------------------------------
check-env = { cmd = "python scripts/check_env.py", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/external" }, description = "Verify torch/CUDA/torch_scatter/TrackEverything imports" }

# --- inference --------------------------------------------------------------
make-test-video = { cmd = "python scripts/make_test_video.py", description = "Generate the synthetic test clip" }
infer = { cmd = "python -m trackeverything.demo_hf --video test_data/synthetic_16f.mp4 --output_dir outputs/standalone_16f --geometry_backend pi3 --mode dense --num_iters 3 --voxel_size 0.02 --mem_efficient --max_frames 16", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/external" }, description = "Run standalone inference via the original upstream CLI" }
infer-wrapped = { cmd = "python scripts/run_inference.py --video test_data/synthetic_16f.mp4 --output_dir outputs/standalone_16f --geometry_backend pi3 --mode dense --num_iters 3 --voxel_size 0.02 --max_frames 16", description = "Same, plus wall-clock and peak VRAM measurement" }

# --- verification -----------------------------------------------------------
inspect-results = { cmd = "python scripts/inspect_results.py outputs/standalone_16f", description = "Inspect tracks.pt / geometry.pt" }

# --- ComfyUI nodes ----------------------------------------------------------
test-nodes = { cmd = "python tests/test_comfy_nodes.py", description = "Node unit tests (fake worker, no GPU)" }
test-nodes-e2e = { cmd = "python tests/test_node_e2e.py", description = "Node end-to-end test with the real model" }
diagnose-vram = { cmd = "python scripts/diagnose_vram.py --max_frames 16", description = "Per-stage CUDA memory diagnostics" }
